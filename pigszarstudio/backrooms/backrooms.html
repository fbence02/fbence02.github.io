function stream(all){const vr=cur.o?3:2,a0=Math.floor(Math.round(P.x/CELL)/CH),b0=Math.floor(Math.round(P.z/CELL)/CH);let n=0;
 for(let r=0;r<=vr;r++)for(let a=a0-r;a<=a0+r;a++)for(let b=b0-r;b<=b0+r;b++){const k=a+','+b;if(Math.max(Math.abs(a-a0),Math.abs(b-b0))==r&&!ch.has(k)&&(all||n<1)){ch.set(k,buildChunk(a,b));n++}}
 for(const[k,c]of ch)if(Math.max(Math.abs(c.a-a0),Math.abs(c.b-b0))>vr+1){scene.remove(c.g);c.g.traverse(o=>{if(o.isPoints)o.geometry.dispose()});ch.delete(k)}}

/* sky, dust, exit, entities */
const sky=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'#fff');r.addColorStop(.18,'#fff');r.addColorStop(.22,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,128,128);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),fog:false,depthWrite:false,transparent:true}));s.scale.set(90,90,1);scene.add(s);return s})();
const dn=240,dp=new Float32Array(dn*3),dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dg,new THREE.PointsMaterial({map:sky.material.map,color:0xffffff,size:.14,transparent:true,opacity:.4,depthWrite:false}));dust.frustumCulled=false;scene.add(dust);
const exg=new THREE.Group(),exl=new THREE.PointLight(0xaaffcc,1.3,16,1.5);
exg.add(new THREE.Mesh(new THREE.BoxGeometry(1.7,2.7,.18),new THREE.MeshBasicMaterial({color:0xe8fff0})));
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,70,12,1,true),new THREE.MeshBasicMaterial({color:0x9dffb8,transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));beam.position.y=35;exl.position.set(0,1.5,1);exg.add(beam,exl);scene.add(exg);
const ET=[faceTex(0),faceTex(1)],halS=new THREE.Sprite(new THREE.SpriteMaterial({map:ET[0],fog:false,transparent:true}));halS.scale.set(2.4,2.4,1);halS.visible=false;scene.add(halS);
function place(e){for(let t=0;t<40;t++){const a=Math.random()*6.283,d=26+Math.random()*12,x=P.x+Math.cos(a)*d,z=P.z+Math.sin(a)*d;if(!solidAt(x,z)){e.x=x;e.z=z;return}}e.x=P.x+30;e.z=P.z}
function addEnt(k){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:ET[k],fog:false,transparent:true}));s.scale.set(k?1.9:2.4,k?3.8:2.4,1);scene.add(s);const e={k,s,x:0,z:0};place(e);ents.push(e)}

/* ---------- audio ---------- */
let AC,mg,hum,hf,wg,nb;
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 mg=AC.createGain();mg.gain.value=.6;mg.connect(AC.destination);nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 hum=AC.createOscillator();hum.type='sawtooth';hf=AC.createBiquadFilter();hf.type='lowpass';const hg=AC.createGain();hg.gain.value=.07;hum.connect(hf);hf.connect(hg);hg.connect(mg);hum.start();
 const o2=AC.createOscillator(),g2=AC.createGain();o2.frequency.value=119.6;g2.gain.value=.025;o2.connect(g2);g2.connect(mg);o2.start();
 const ws=AC.createBufferSource();ws.buffer=nb;ws.loop=true;const wf=AC.createBiquadFilter();wf.type='bandpass';wf.frequency.value=500;wg=AC.createGain();wg.gain.value=0;ws.connect(wf);wf.connect(wg);wg.connect(mg);ws.start()}
function snd(f,dur,vol,type){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;fl.type=type||'lowpass';fl.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(mg);s.start(t,Math.random(),dur)}
function tn(f,dur,vol){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur)}

/* ---------- flow ---------- */
function go(i){li=i;cur=LV[i];SEED=Math.random()*1e6|0;taken.clear();const L=cur;mats(L);
 for(const c of ch.values())scene.remove(c.g);ch.clear();
 scene.fog=new THREE.FogExp2(L.fog,L.d);scene.background=new THREE.Color(L.fog);
 amb.color.set(L.amb);pl.color.set(L.lc);dl.intensity=L.o?.8:0;dl.color.set(L.dcol||0x8fa0ff);
 sky.visible=!!L.o;if(L.o)sky.material.color.set(L.sky);dust.material.size=L.steam?.9:.14;dust.material.opacity=L.steam?.16:.4;
 const s=spawn();P.x=s[0]*CELL;P.z=s[1]*CELL;cy=ph(L,s[0],s[1])+1.65;yaw=Math.random()*6.28;pitch=0;
 for(let k=0;k<dn;k++){dp[k*3]=P.x+(Math.random()-.5)*28;dp[k*3+1]=Math.random()*3;dp[k*3+2]=P.z+(Math.random()-.5)*28}
 stream(true);ents.forEach(e=>scene.remove(e.s));ents.length=0;flowD=new Map();ft=0;
 if(mode==0){const c=findExit(s[0],s[1]);exitP={x:c[0]*CELL,z:c[1]*CELL};exg.position.set(exitP.x,ph(L,c[0],c[1]),exitP.z);exg.rotation.y=Math.random()*6.28;exg.children[0].position.y=1.4;exg.visible=true}else exg.visible=false;
 if(AC){hum.frequency.value=L.a[0];hf.frequency.value=L.a[1];wg.gain.value=L.a[2]}
 if(running){const c=$('#card');c.innerHTML=`<h2>${L.n}</h2><b>${L.t}</b><p>${L.q}</p>`;c.className='';void c.offsetWidth;c.className='on'}}
function warp(i){if(busy)return;busy=true;$('#fade').style.opacity=1;snd(120,.8,.5);setTimeout(()=>{go(i);$('#fade').style.opacity=0;busy=false},650)}
const pickNext=()=>{let n;do n=Math.floor(Math.random()*LV.length);while(n==li);return n},infoTxt=()=>mode?`Explorer: no entities. Keys 1–8 choose a level, N next, V noclip${noclip?' (on)':''}, F flashlight.\n1 Lobby · 2 Habitable · 3 Pipes · 4 Hotel · 5 Suburbs · 6 Field · 7 Stairs · 8 Pools`:'';
function menu(h,p,r){$('#mh').textContent=h;$('#mp').textContent=p;$('#bR').style.display=r?'block':'none';$('#menu').style.display='flex';if(document.exitPointerLock)document.exitPointerLock()}
const pause=()=>{if(!running)return;running=false;for(const k in K)K[k]=false;menu('Paused','The hum continues without you.',1)};
const resume=()=>{running=true;$('#menu').style.display='none';try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}if(AC&&AC.state=='suspended')AC.resume()};
function start(m){audio();mode=m;depth=0;sanity=stam=batt=100;fon=true;noclip=false;dead=false;$('#hud').style.display='block';$('#sig').style.display=m?'none':'block';$('#bars').style.display=m?'none':'grid';$('#info').textContent=infoTxt();resume();go(0)}
function die(w){if(dead)return 1;dead=true;running=false;cv.style.filter='';snd(400,1.4,.9,'highpass');tn(36,1.6,.9);menu('You were taken',`${w} Levels survived: ${depth}. Best: ${best}.`,0)}

/* ---------- simulation ---------- */
function game(dt){
 for(const c of ch.values())for(let i=c.pk.length-1;i>=0;i--){const q=c.pk[i];q.m.rotation.y+=dt*2;if(Math.hypot(q.m.position.x-P.x,q.m.position.z-P.z)<1.3){c.g.remove(q.m);c.pk.splice(i,1);taken.add(q.key);if(q.t)batt=Math.min(100,batt+45);else{sanity=Math.min(100,sanity+35);stam=100}tn(660,.25,.2)}}
 const ex=exitP.x-P.x,ez=exitP.z-P.z,ed=Math.hypot(ex,ez);
 $('#dist').textContent=(sanity<30?'≈ ':'')+Math.round(ed)+' m';$('#arr').style.transform=`rotate(${yaw-Math.atan2(-ex,-ez)}rad)`;
 if(ed<1.7&&!busy){depth++;if(depth>best){best=depth;try{localStorage.setItem('brb',best)}catch(e){}}return warp(pickNext())}
 if((ft-=dt)<=0){ft=.4;flow()}
 const want=Math.min(1+(depth>>1),4);while(ents.length<want)addEnt(ents.length%2);
 let near=99;
 for(const e of ents){const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz)||1;near=Math.min(near,d);
  const seen=d<60&&(dx*Math.sin(yaw)+dz*Math.cos(yaw))/d>.55&&los(e.x,e.z,P.x,P.z);
  if(!e.k){if(!seen){const v=Math.min(3.4,2.5+depth*.12)*dt;e.x+=dx/d*v;e.z+=dz/d*v}else sanity-=dt*(d<10?7:2.5)}
  else{const gx=Math.round(e.x/CELL),gz=Math.round(e.z/CELL);let bd=flowD.get(gx+','+gz),bx=P.x,bz=P.z,v=1.1;
   if(bd!==undefined){v=bd<26?Math.min(5,4.3+depth*.1):1.3;if(bd>0){let nbr=null;for(const[a,b]of DIRS){const q=flowD.get((gx+a)+','+(gz+b));if(q!==undefined&&q<bd){bd=q;nbr=[gx+a,gz+b]}}if(nbr){bx=nbr[0]*CELL;bz=nbr[1]*CELL}}}
   const tx=bx-e.x,tz=bz-e.z,td=Math.hypot(tx,tz)||1;mv(e,tx/td*v*dt,tz/td*v*dt,.4)}
  e.s.position.set(e.x,ph(cur,Math.round(e.x/CELL),Math.round(e.z/CELL))+(e.k?1.9:1.6),e.z);
  if(d<1.1)return die(e.k?'Something tall found you.':'The smile reached you.');
  if(d>80)place(e)}
 sanity=Math.max(0,Math.min(100,sanity+dt*(near<24?-(24-near)*.1:(fon?.6:-.5))));
 if(sanity<=0)return die('Your mind slipped away.');
 if(near<22){hb-=dt;if(hb<=0){hb=.3+near/30;tn(52,.15,.55);setTimeout(()=>tn(46,.14,.4),150)}}
 if(sanity<40&&hal<=0&&Math.random()<dt*.25){hal=.35;halS.position.set(P.x+fwd.x*7+(Math.random()-.5)*5,1.7,P.z+fwd.z*7);halS.visible=true;tn(90,.4,.25)}
 if(hal>0){hal-=dt;if(hal<=0)halS.visible=false}
 $('#bs').style.width=sanity+'%';$('#bt').style.width=stam+'%';$('#bb').style.width=batt+'%';
 if((fxT-=dt)<0){fxT=.2;const q=Math.max(0,45-sanity);cv.style.filter=q?`saturate(${1+q/35}) hue-rotate(${q*.8}deg) blur(${q/70}px)`:''}}
function upd(dt){T+=dt;
 yaw+=((K.ArrowLeft?1:0)-(K.ArrowRight?1:0))*1.8*dt;pitch=Math.max(-1.5,Math.min(1.5,pitch+((K.ArrowUp?1:0)-(K.ArrowDown?1:0))*1.4*dt));
 let f=(K.KeyW?1:0)-(K.KeyS?1:0),s=(K.KeyD?1:0)-(K.KeyA?1:0);
 const mvg=f||s,gh=ph(cur,Math.round(P.x/CELL),Math.round(P.z/CELL)),wade=cur.pl=='po'&&gh<0,spr=mvg&&(K.ShiftLeft||K.ShiftRight)&&(mode||stam>0),spd=(wade?2.3:3.6)*(spr?1.75:1);
 if(mvg){const l=Math.hypot(f,s);f/=l;s/=l;const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*spd*dt,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*spd*dt;if(noclip){P.x+=dx*2.5;P.z+=dz*2.5}else mv(P,dx,dz,.32);st+=spd*dt;if(st>2.1){st=0;snd(wade?900:cur.a[3],.09,.3)}}
 if(mode==0){if(spr)stam=Math.max(0,stam-22*dt);else stam=Math.min(100,stam+(mvg?8:16)*dt);if(fon){batt-=1.3*dt;if(batt<=0){batt=0;fon=false}}}
 cy+=(gh+1.65-cy)*Math.min(1,dt*9);
 fwd.set(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
 cam.position.set(P.x,cy+(mvg?Math.sin(T*(spr?13:9))*.04:0)-(wade?.25:0),P.z);cam.rotation.set(pitch,yaw,Math.sin(T*1.3)*.025*(1-sanity/100));
 flk=Math.max(0,flk-dt);if(Math.random()<dt*(.3+(100-sanity)/60))flk=.08+Math.random()*.25;const fl=flk>0&&Math.random()<.6?.25:1;
 cur.m.e.color.setHex(cur.lc).multiplyScalar(fl);amb.intensity=fl<1?.65:1;pl.intensity=fl<1?.6:1.05;
 pl.position.set(P.x,cam.position.y+.2,P.z);spt.position.copy(cam.position);spt.target.position.copy(cam.position).addScaledVector(fwd,10);spt.intensity=fon?(batt<15&&Math.random()<.3&&mode==0?.3:1.8):0;
 stream();if(cur.m.wt)cur.m.wt.map.offset.set(T*.01,T*.006);
 for(let k=0;k<dn;k++){const j=k*3;dp[j+1]+=dt*(cur.steam?.7:.04);if(Math.abs(dp[j]-P.x)>14||Math.abs(dp[j+2]-P.z)>14||dp[j+1]>cur.h){dp[j]=P.x+(Math.random()-.5)*26;dp[j+1]=Math.random()*3;dp[j+2]=P.z+(Math.random()-.5)*26}}dg.attributes.position.needsUpdate=true;
 sky.position.set(P.x-120,cam.position.y+90,P.z-200);
 if(cur.pl=='po'&&Math.random()<dt*.5)tn(900+Math.random()*900,.12,.03);
 if(mode==0)game(dt)}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running&&!busy)upd(dt);else if(!running){yaw+=dt*.07;cam.position.set(P.x,cy,P.z);cam.rotation.set(0,yaw,0);pl.position.copy(cam.position);spt.intensity=0}
 ren.render(scene,cam)}

/* ---------- input ---------- */
let drag=false;cv.addEventListener('mousedown',()=>drag=true);addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(running&&(document.pointerLockElement||drag)){yaw-=e.movementX*.0022;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0022))}});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&running&&!dead)pause()});
addEventListener('keydown',e=>{K[e.code]=true;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();if(!running)return;
 if(e.code=='KeyF'&&(mode||batt>0)){fon=!fon;tn(1800,.03,.1)}
 if(mode==1){if(/^Digit[1-8]$/.test(e.code))warp(+e.code[5]-1);if(e.code=='KeyN')warp((li+1)%LV.length);if(e.code=='KeyV'){noclip=!noclip;$('#info').textContent=infoTxt()}}
 if(e.code=='Escape'&&!document.pointerLockElement)pause()});
addEventListener('keyup',e=>K[e.code]=false);
$('#bN').onclick=()=>start(0);$('#bE').onclick=()=>start(1);$('#bR').onclick=resume;
const gc=$('#grain').getContext('2d'),gi=gc.createImageData(160,90);
setInterval(()=>{for(let i=0;i<gi.data.length;i+=4){gi.data[i]=gi.data[i+1]=gi.data[i+2]=Math.random()*255;gi.data[i+3]=255}gc.putImageData(gi,0,0)},110);
go(0);requestAnimationFrame(loop);
</script></body></html>

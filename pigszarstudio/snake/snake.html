<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake – automata kígyó</title>
<style>
:root{--bg:#eef0f6;--fg:#151823;--mut:#5d6378;--card:#fff;--line:#d7dbe7;--acc:#16a34a;--accfg:#fff;--board:#dfe4ef;--gridc:#cdd4e3;--food:#e11d48;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1017;--fg:#eceef6;--mut:#9aa1b8;--card:#181b26;--line:#2a2f40;--acc:#22c55e;--accfg:#05200f;--board:#12151f;--gridc:#1c2030;--food:#fb4a6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1017;--fg:#eceef6;--mut:#9aa1b8;--card:#181b26;--line:#2a2f40;--acc:#22c55e;--accfg:#05200f;--board:#12151f;--gridc:#1c2030;--food:#fb4a6a;color-scheme:dark}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:14px;padding:10px 14px;font-size:14px;color:var(--mut)}
#hud b{color:var(--fg);font-variant-numeric:tabular-nums}
#hud .sp{flex:1}
#bot{background:var(--acc);color:var(--accfg);border-radius:99px;padding:2px 10px;font-weight:600;font-size:13px}
button{font:inherit;border:0;border-radius:12px;padding:11px 18px;background:var(--acc);color:var(--accfg);font-weight:600;cursor:pointer}
button.sec{background:var(--line);color:var(--fg)}
#mb{padding:8px 14px}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{border-radius:12px;touch-action:none;box-shadow:0 6px 30px rgba(0,0,0,.18)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;margin:auto;box-sizing:border-box}
#msg .card{max-width:300px;text-align:center}
h1{margin:0 0 8px;font-size:24px}
h2{margin:16px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
p{margin:6px 0}
#menu{position:fixed;inset:0;display:flex;overflow-y:auto;background:rgba(0,0,0,.5);padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);box-sizing:border-box}
#pv{width:100%;height:60px;display:block;border-radius:10px;background:var(--board)}
label{display:block;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
select,input[type=color]{display:block;width:100%;margin-top:4px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:0 8px;box-sizing:border-box}
input[type=color]{padding:2px}
input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.auto{display:flex!important;gap:10px;align-items:flex-start;border:2px solid var(--acc);border-radius:14px;padding:12px;margin-top:6px;cursor:pointer}
.auto small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.auto input{width:20px;height:20px;accent-color:var(--acc);margin:2px 0 0}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:12px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span>Pont <b id="sc">0</b></span><span>Hossz <b id="ln">3</b></span><span>Rekord <b id="bs">0</b></span>
    <span id="bot" hidden>🤖 Auto</span><span class="sp"></span>
    <button id="mb" class="sec">☰ Menü</button>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="msg" hidden><div class="card"><h1 id="mt"></h1><p id="mp"></p>
      <div class="btns"><button id="tomenu" class="sec">Menü</button><button id="again">Újra</button></div></div></div>
  </div>
</div>

<div id="menu" hidden>
  <div class="card">
    <h1>🐍 Snake</h1>
    <canvas id="pv"></canvas>
    <h2>Kígyó</h2>
    <label>Színezés
      <select id="mode"><option value="solid">Egyszínű</option><option value="gradient">Színátmenet</option><option value="rainbow">Szivárvány (animált)</option></select>
    </label>
    <div class="two"><label>Fej színe<input type="color" id="c1"></label><label id="c2l">Farok színe<input type="color" id="c2"></label></div>
    <div class="chips">
      <label><input type="checkbox" id="glow">✨ Ragyogás</label>
      <label><input type="checkbox" id="trail">🌫️ Nyomvonal</label>
      <label><input type="checkbox" id="parts">💥 Részecskék</label>
      <label><input type="checkbox" id="eyes">👀 Szemek</label>
      <label><input type="checkbox" id="grid">▦ Rács</label>
    </div>
    <h2>Pálya</h2>
    <label>Méret: <b id="szv"></b><input type="range" id="size" min="8" max="40" step="2"></label>
    <label>Sebesség: <b id="spv"></b><input type="range" id="sp" min="0" max="100"></label>
    <label class="auto"><input type="checkbox" id="auto"><span>🤖 Automata játék<small>A kígyó magától, a legrövidebb biztonságos úton kijátssza a játékot: Hamilton-kör és rövidítések, soha nem ütközik.</small></span></label>
    <div class="btns"><button id="cont" class="sec" hidden>Folytatás</button><button id="go">Játék indítása</button></div>
    <p class="hint">Irányítás: nyilak / WASD vagy húzás ujjal · Esc: menü</p>
  </div>
</div>

<script>
(()=>{
const $=i=>document.getElementById(i);
const S={mode:'gradient',c1:'#22c55e',c2:'#0ea5e9',glow:true,trail:true,parts:true,eyes:true,grid:true,size:20,sp:30,auto:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('snk')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('snk',JSON.stringify(S))}catch(e){}};
const cv=$('cv'),ctx=cv.getContext('2d'),pv=$('pv'),pc=pv.getContext('2d');
let R1,R2,TH={},cs=10,dpr=1,W,H,N,order,idx,snake,occ,dir,dq,food,score,bestV=0,state='menu',gm={},trail=[],parts=[],acc=0;
const DIRS=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const spd=()=>Math.round(3*Math.pow(100,S.sp/100));

['glow','trail','parts','eyes','grid','auto'].forEach(k=>{const e=$(k);e.checked=!!S[k];e.onchange=()=>{S[k]=e.checked;save();ui()}});
['c1','c2','mode'].forEach(k=>{const e=$(k);e.value=S[k];e.oninput=()=>{S[k]=e.value;save();ui()}});
['size','sp'].forEach(k=>{const e=$(k);e.value=S[k];e.oninput=()=>{S[k]=+e.value;save();ui()}});
function ui(){R1=rgb(S.c1);R2=rgb(S.c2);$('szv').textContent=S.size+'×'+S.size;$('spv').textContent=spd()+' lépés/mp';$('c2l').hidden=S.mode!=='gradient';$('bot').hidden=!gm.auto;$('cont').hidden=!(state==='pause'&&gm.size===S.size&&gm.auto===S.auto)}

function readTheme(){const s=getComputedStyle(document.documentElement);['board','gridc','food'].forEach(k=>TH[k]=s.getPropertyValue('--'+k).trim())}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);

function col(i,n,t){
  if(S.mode==='rainbow')return 'hsl('+(t*80+i*(360/Math.max(n,24)))%360+',90%,58%)';
  if(S.mode==='gradient'){const k=n>1?i/(n-1):0;return 'rgb('+(R1[0]+(R2[0]-R1[0])*k|0)+','+(R1[1]+(R2[1]-R1[1])*k|0)+','+(R1[2]+(R2[2]-R1[2])*k|0)+')'}
  return S.c1;
}

function buildCycle(){
  order=[];
  for(let x=0;x<W;x++)order.push([x,0]);
  for(let y=1;y<H;y++){if(y%2)for(let x=W-1;x>=1;x--)order.push([x,y]);else for(let x=1;x<W;x++)order.push([x,y])}
  for(let y=H-1;y>=1;y--)order.push([0,y]);
  idx=new Int32Array(N);order.forEach((p,i)=>idx[p[1]*W+p[0]]=i);
}

function newGame(){
  W=H=S.size;N=W*H;gm={size:S.size,auto:S.auto};buildCycle();
  snake=[2,1,0].map(i=>({x:order[i][0],y:order[i][1]}));
  occ=new Uint8Array(N);snake.forEach(s=>occ[s.y*W+s.x]=1);
  dir={x:1,y:0};dq=[];score=0;trail=[];parts=[];acc=0;
  try{bestV=+localStorage.getItem('snb'+W)||0}catch(e){bestV=0}
  placeFood();resize();hud();$('msg').hidden=true;ui();
}
function placeFood(){const e=[];for(let i=0;i<N;i++)if(!occ[i])e.push(i);if(!e.length){food=null;return}const k=e[Math.random()*e.length|0];food={x:k%W,y:k/W|0}}
function hud(){$('sc').textContent=score;$('ln').textContent=snake.length+'/'+N;$('bs').textContent=bestV}

function autoDir(){
  const h=snake[0],t=snake[snake.length-1];
  const hi=idx[h.y*W+h.x],ti=idx[t.y*W+t.x],fi=food?idx[food.y*W+food.x]:hi;
  const dt=(ti-hi+N)%N,df=(fi-hi+N)%N;
  let best=null,bd=0;
  for(const d of DIRS){
    const x=h.x+d.x,y=h.y+d.y;if(x<0||y<0||x>=W||y>=H)continue;
    const k=(idx[y*W+x]-hi+N)%N;
    if(k>=1&&k<dt&&k<=df&&k>bd){bd=k;best=d}
  }
  if(best)return best;
  const n=order[(hi+1)%N];return {x:n[0]-h.x,y:n[1]-h.y};
}

function step(){
  let d;
  if(gm.auto)d=autoDir();else{if(dq.length)dir=dq.shift();d=dir}
  const h=snake[0],nx=h.x+d.x,ny=h.y+d.y;
  if(nx<0||ny<0||nx>=W||ny>=H)return end(false);
  const eat=food&&nx===food.x&&ny===food.y,t=snake[snake.length-1];
  if(occ[ny*W+nx]&&(eat||nx!==t.x||ny!==t.y))return end(false);
  if(!eat){snake.pop();occ[t.y*W+t.x]=0;if(S.trail)trail.push({x:t.x,y:t.y,a:1})}
  snake.unshift({x:nx,y:ny});occ[ny*W+nx]=1;
  if(eat){
    score=snake.length-3;
    if(!gm.auto&&score>bestV){bestV=score;try{localStorage.setItem('snb'+W,bestV)}catch(e){}}
    if(S.parts)burst(nx,ny,16);
    if(snake.length>=N){food=null;hud();return end(true)}
    placeFood();
  }
  hud();
}
function end(win){
  state=win?'win':'over';
  if(S.parts&&!win)burst(snake[0].x,snake[0].y,40);
  $('mt').textContent=win?'🏆 Kijátszva!':'💀 Vége a játéknak';
  $('mp').textContent=win?'A kígyó betöltötte az egész '+W+'×'+H+'-as pályát.':'Pontszám: '+score;
  $('msg').hidden=false;
}
function burst(x,y,n){
  const now=performance.now()/1000,L=snake.length;
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1.5+Math.random()*4;parts.push({x:x+.5,y:y+.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:col(Math.random()*L|0,L,now)})}
}

function drawFood(c,s,x,y,t){
  const r=s*(.33+.05*Math.sin(t*6)),px=(x+.5)*s,py=(y+.5)*s;
  c.save();if(S.glow){c.shadowColor=TH.food;c.shadowBlur=s*.9}
  c.fillStyle=TH.food;c.beginPath();c.arc(px,py,r,0,6.283);c.fill();c.restore();
  c.fillStyle='#3fbf5f';c.beginPath();c.ellipse(px+r*.3,py-r*1.0,r*.35,r*.2,-.6,0,6.283);c.fill();
}
function drawSnake(c,sg,s,t){
  const n=sg.length;c.lineCap='round';c.lineJoin='round';
  const P=i=>[(sg[i].x+.5)*s,(sg[i].y+.5)*s],wd=i=>s*(.9-.34*(n>1?i/(n-1):0));
  const seg=(i,m)=>{const a=P(i),b=i<n-1?P(i+1):[a[0]+.01,a[1]];c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineWidth=wd(i)*m;c.stroke()};
  if(S.glow){c.globalAlpha=.16;for(let i=n-1;i>=0;i--){c.strokeStyle=col(i,n,t);seg(i,1.9)}c.globalAlpha=1}
  for(let i=n-1;i>=0;i--){
    c.strokeStyle=col(i,n,t);
    if(i===0&&S.glow){c.shadowColor=c.strokeStyle;c.shadowBlur=s*.8}
    seg(i,1);
  }
  c.shadowBlur=0;
  if(S.eyes){
    const p=P(0);let dx=1,dy=0;
    if(n>1){dx=sg[0].x-sg[1].x;dy=sg[0].y-sg[1].y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l}
    for(const sd of[-1,1]){
      const ex=p[0]+dx*s*.14-dy*s*.2*sd,ey=p[1]+dy*s*.14+dx*s*.2*sd;
      c.fillStyle='#fff';c.beginPath();c.arc(ex,ey,s*.15,0,6.283);c.fill();
      c.fillStyle='#111';c.beginPath();c.arc(ex+dx*s*.04,ey+dy*s*.04,s*.075,0,6.283);c.fill();
    }
  }
}
function draw(t){
  const w=cs*W;ctx.clearRect(0,0,w,w);ctx.fillStyle=TH.board;ctx.fillRect(0,0,w,w);
  if(S.grid){ctx.strokeStyle=TH.gridc;ctx.lineWidth=1;ctx.beginPath();for(let i=1;i<W;i++){ctx.moveTo(i*cs+.5,0);ctx.lineTo(i*cs+.5,w);ctx.moveTo(0,i*cs+.5);ctx.lineTo(w,i*cs+.5)}ctx.stroke()}
  if(trail.length){ctx.fillStyle=col(snake.length-1,snake.length,t);for(const r of trail){ctx.globalAlpha=r.a*.35;ctx.fillRect(r.x*cs+2,r.y*cs+2,cs-4,cs-4)}ctx.globalAlpha=1}
  if(food)drawFood(ctx,cs,food.x,food.y,t);
  drawSnake(ctx,snake,cs,t);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x*cs,p.y*cs,cs*.13,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;
}
function drawPreview(t){
  const w=pv.clientWidth,h=60,pw=Math.round(w*dpr);
  if(pv.width!==pw){pv.width=pw;pv.height=Math.round(h*dpr)}
  pc.setTransform(dpr,0,0,dpr,0,0);pc.clearRect(0,0,w,h);
  const s=30,n=Math.min(16,Math.floor(w/s)-2),sg=[];
  for(let i=0;i<n;i++)sg.push({x:n-1-i,y:.5+.4*Math.sin(t*3-i*.6)});
  drawFood(pc,s,n+.3,.5,t);drawSnake(pc,sg,s,t);
}
function resize(){
  dpr=window.devicePixelRatio||1;
  const a=Math.min($('wrap').clientWidth,$('wrap').clientHeight)-16;
  cs=Math.max(4,Math.floor(a/W));const px=cs*W;
  cv.style.width=cv.style.height=px+'px';cv.width=cv.height=Math.round(px*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);readTheme();
}
new ResizeObserver(()=>W&&resize()).observe($('wrap'));

let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0),t=ts/1000;last=ts;
  if(state==='play'){
    acc+=dt;const iv=1/spd();let n=0;
    while(acc>=iv&&n<40&&state==='play'){acc-=iv;step();n++}
    if(n>=40)acc=0;
  }
  for(const r of trail)r.a-=dt*1.6;trail=trail.filter(r=>r.a>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.6}parts=parts.filter(p=>p.l>0);
  draw(t);if(!$('menu').hidden)drawPreview(t);
  requestAnimationFrame(loop);
}

function turn(d){
  if(state!=='play'||gm.auto)return;
  const r=dq.length?dq[dq.length-1]:dir;
  if((d.x===-r.x&&d.y===-r.y)||(d.x===r.x&&d.y===r.y)||dq.length>2)return;
  dq.push(d);
}
const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='p'){openMenu();return}
  const k=K[e.key]||K[e.key.toLowerCase()];
  if(k&&state==='play'){e.preventDefault();turn({x:k[0],y:k[1]})}
});
let tp=null;
cv.addEventListener('pointerdown',e=>{tp={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{
  if(!tp)return;const dx=e.clientX-tp.x,dy=e.clientY-tp.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>22){turn(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)});tp={x:e.clientX,y:e.clientY}}
});
addEventListener('pointerup',()=>tp=null);

function openMenu(){if(state==='play')state='pause';$('menu').hidden=false;ui()}
function start(){newGame();$('menu').hidden=true;state='play';ui()}
$('mb').onclick=openMenu;$('tomenu').onclick=openMenu;
$('go').onclick=start;$('again').onclick=start;
$('cont').onclick=()=>{$('menu').hidden=true;state='play';ui()};

ui();newGame();openMenu();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
